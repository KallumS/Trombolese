[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trombolese"
version = "0.1.0"
description = "Offline acoustic model of the Trombolese bore: a trombone-oboe hybrid with a continuous cylinder-to-cone morph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
audio = ["soundfile>=0.12"]
dev = ["matplotlib>=3.7", "soundfile>=0.12", "pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
